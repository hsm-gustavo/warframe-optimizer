services:
  postgres:
    image: postgres:17-alpine
    container_name: warframe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: warframe
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: warframe
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warframe -d warframe"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
